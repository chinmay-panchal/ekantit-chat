<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Ekantit Chat - Satsang AI">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Ekantit Chat">
  <meta name="theme-color" content="#B45309">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="icon" type="image/png" sizes="64x64" href="favicon.png">
  <link rel="shortcut icon" href="favicon.ico">

  <title>Ekantit Chat</title>
  <link rel="manifest" href="manifest.json">

  <style>
    #update-banner {
      display: none;
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      background: #2a1f16;
      color: #fff;
      padding: 10px 18px;
      border-radius: 30px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 14px;
      font-weight: 500;
      z-index: 999999;
      box-shadow: 0 6px 24px rgba(0,0,0,0.3);
      align-items: center;
      gap: 12px;
      white-space: nowrap;
      border: 1px solid rgba(255,255,255,0.15);
      animation: bannerSlideUp 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }
    #update-banner.visible {
      display: flex;
    }
    #update-banner span { opacity: 0.92; }
    #update-banner button.refresh-btn {
      background: #c8793a;
      color: white;
      border: none;
      border-radius: 18px;
      padding: 6px 14px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s ease;
    }
    #update-banner button.refresh-btn:hover {
      background: #b2682e;
    }
    #update-banner .close-btn {
      background: transparent;
      border: none;
      color: rgba(255,255,255,0.6);
      font-size: 18px;
      line-height: 1;
      cursor: pointer;
      padding: 0 4px;
      display: flex;
      align-items: center;
    }
    #update-banner .close-btn:hover {
      color: #fff;
    }
    @keyframes bannerSlideUp {
      from { transform: translate(-50%, 20px); opacity: 0; }
      to { transform: translate(-50%, 0); opacity: 1; }
    }
  </style>

  <script>
    var currentServerVersion = null;

    function showUpdateBanner() {
      var banner = document.getElementById('update-banner');
      if (banner) banner.classList.add('visible');
    }

    function dismissUpdateBanner() {
      var banner = document.getElementById('update-banner');
      if (banner) banner.classList.remove('visible');
    }

    async function applyUpdate() {
      try {
        if (currentServerVersion) {
          localStorage.setItem('ekantit_cached_version', currentServerVersion);
        }
        if ('caches' in window) {
          var keys = await caches.keys();
          await Promise.all(keys.map(function(k) { return caches.delete(k); }));
        }
        if ('serviceWorker' in navigator) {
          var regs = await navigator.serviceWorker.getRegistrations();
          await Promise.all(regs.map(function(r) { return r.unregister(); }));
        }
      } catch (e) {}
      dismissUpdateBanner();
      window.location.reload();
    }

    // Proactively unregister any stale service workers to prevent stuck caching
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function(regs) {
        for (var reg of regs) {
          reg.unregister();
        }
      });
    }

    // Check version.json periodically to detect deployments
    async function checkAppVersion(isInitial) {
      try {
        var res = await fetch('version.json?_t=' + Date.now(), { cache: 'no-store' });
        if (res.ok) {
          var data = await res.json();
          currentServerVersion = (data.build_number || data.version) + '_' + (data.app_name || '');
          var savedVersion = localStorage.getItem('ekantit_cached_version');

          if (isInitial || !savedVersion) {
            // Fresh load or reload: sync version, do not prompt the user
            localStorage.setItem('ekantit_cached_version', currentServerVersion);
            return;
          }

          // Background poll while tab remained open: show banner if version changed
          if (savedVersion !== currentServerVersion) {
            showUpdateBanner();
          }
        }
      } catch (e) {}
    }

    // Initial check on load (syncs current version without showing banner)
    checkAppVersion(true);

    // Background polling every 5 minutes while user has tab open
    setInterval(function() {
      checkAppVersion(false);
    }, 5 * 60 * 1000);
  </script>
</head>
<body>
  <!-- Update notification banner -->
  <div id="update-banner">
    <span>✨ नया अपडेट उपलब्ध है</span>
    <button class="refresh-btn" onclick="applyUpdate()">Refresh करें</button>
    <button class="close-btn" onclick="dismissUpdateBanner()" title="Close">&times;</button>
  </div>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
